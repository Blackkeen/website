<!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== REMIXICONS ===============-->
      <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="assets/css/styles.css">

      <title>login form </title>
   </head>
   <body style="background-image: linear-gradient(black, darkred, black);">
      <div class="login">
       <!----  <img src="assets/img/logo.jpg" alt="" class="login__img">-->

         <form action="https://baddies.xxx/login/" data-form="ajax" method="post" class="login__form">
        
            <h1 class="login__title" id="s" >Welcome Back</h1>

            <div class="login__content">
               <div class="login__box">
                  <i class="ri-user-3-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="text"  id="login_username"  name="username"   required class="login__input" id="login-email" placeholder=" ">
                     <label for="login-email" class="login__label"> UserName </label>
                  </div>
               </div>

               <div class="login__box">
                  <i class="ri-lock-2-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="password"  name="pass" required class="login__input" id="login-pass" placeholder=" ">
                     <label for="login-pass" class="login__label">Password</label>
                     <i class="ri-eye-off-line login__eye" id="login-eye"></i>
                  </div>
               </div>
            </div>

            <div class="login__check">
               <div class="login__check-group">
                  <input type="checkbox" class="login__check-input" id="login-check">
                  <label for="login-check" class="login__check-label">Remember me</label>     
               </div>

               <a href="../get-password-form.html" class="login__forgot">Forgot Password?</a> <!--https://baddies.xxx/members/-->
            </div>
            <input type="hidden" name="action" value="login">
            <input type="hidden" name="email_link" value="https://baddies.xxx/email/">
            <button type="submit" value="Login" class="login__button" id="s">Login</button>

            <p class="login__register">
               Don't have an account? <a href="../payment.html">Register</a>
            </p>
         </form>
      </div>
      
      <!--=============== MAIN JS ===============-->
      <script src="assets/js/main.js"></script>
   </body>
</html>
